    // --- 2. AUDIO CHIME & NOTIFICATION SYSTEM ---
    function triggerAlarmChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(784, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = "sine";
        osc2.frequency.setValueAtTime(1046.5, now + 0.15);
        gain2.gain.setValueAtTime(0.3, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.55);
      } catch (e) {}
    }

    function checkFollowUpReminders() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const dueLeads = appState.leads.filter(l => l.followUpDate && l.followUpDate <= todayStr && l.status !== "Lost" && l.status !== "Converted");
      if (dueLeads.length > 0 && !window._alarmTriggeredThisSession) {
        window._alarmTriggeredThisSession = true;
        triggerAlarmChime();
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification("KB Loan Follow-Up Reminder", {
              body: `You have ${dueLeads.length} customer lead(s) scheduled for follow-up today!`,
              icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>⏰</text></svg>"
            });
          } catch (e) {}
        }
      }
      return dueLeads;
    }

    // --- 3. INTELLIGENT FINANCIAL & SLABS ENGINE ---
    function formatForWhatsApp(input) {
      if (!input) return "";
      const digits = input.replace(/\D/g, "");
      if (digits.startsWith("03") && digits.length === 11) return "92" + digits.substring(1);
      if (digits.startsWith("3") && digits.length === 10) return "92" + digits;
      if (digits.startsWith("92")) return digits;
      return digits;
    }

    function calculateDetailedAge(dobString) {
      if (!dobString) return { years: 0, months: 0, days: 0, text: "", urduText: "" };
      const parts = dobString.split("-").map(Number);
      if (parts.length !== 3 || isNaN(parts[0])) return { years: 0, months: 0, days: 0, text: "", urduText: "" };
      const dob = new Date(parts[0], parts[1] - 1, parts[2]);
      const now = new Date();
      if (now < dob) return { years: 0, months: 0, days: 0, text: "", urduText: "" };
      let years = now.getFullYear() - dob.getFullYear();
      let months = now.getMonth() - dob.getMonth();
      let days = now.getDate() - dob.getDate();

      if (days < 0) {
        months--;
        const prevMonthLastDay = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += prevMonthLastDay;
      }
      if (months < 0) {
        years--;
        months += 12;
      }
      const y = Math.max(0, years);
      const m = Math.max(0, months);
      const d = Math.max(0, days);
      return {
        years: y,
        months: m,
        days: d,
        text: `${y} Years, ${m} Months, ${d} Days`,
        urduText: `${y} سال، ${m} ماہ، ${d} دن`
      };
    }

    function calculateAge(dobString) {
      return calculateDetailedAge(dobString).years;
    }

    function formatCurrency(amt) {
      const cur = (appState.profile && appState.profile.currency) || "PKR";
      return cur + " " + Math.round(Number(amt || 0)).toLocaleString("en-US");

    function getSelectedProduct() {
      return appState.products.find(p => p.id === appState.calc.productId) || appState.products[0];
    }

    function getApplicableRate(product, amount) {
      if (amount > 0 && product.rateSlabs && product.rateSlabs.length > 0) {
        const slab = product.rateSlabs.find(s => amount >= s.minAmount && amount <= s.maxAmount);
        if (slab) return Number(slab.annualRate);
      }
      return Number(product.defaultAnnualRate);
    }

    function calculateFee(product, principal) {
      let baseFee = 0;
      const fedRate = (appState.profile && appState.profile.fedRate) || 16.0;

      if (principal > 0 && product.feeSlabs && product.feeSlabs.length > 0) {
        const slab = product.feeSlabs.find(s => principal >= s.minAmount && principal <= s.maxAmount);
        if (slab) {
          if (slab.feeType === "fixed") {
            baseFee = Number(slab.feeValue);
          } else if (slab.feeType === "whichever_higher") {
            const pctFee = (principal * Number(slab.feeValue)) / 100;
            const minF = Number(slab.minFee) || 0;
            baseFee = Math.max(pctFee, minF);
            if (slab.maxFee && Number(slab.maxFee) > 0) {
              baseFee = Math.min(baseFee, Number(slab.maxFee));
            }
          } else {
            const pctFee = (principal * Number(slab.feeValue)) / 100;
            baseFee = pctFee;
            if (slab.minFee && Number(slab.minFee) > 0) baseFee = Math.max(baseFee, Number(slab.minFee));
            if (slab.maxFee && Number(slab.maxFee) > 0) baseFee = Math.min(baseFee, Number(slab.maxFee));
          }
        }
      }

      if (baseFee === 0 && principal > 0) {
        if (product.feeType === "fixed") {
          baseFee = Number(product.defaultFeeValue);
        } else {
          baseFee = (principal * Number(product.defaultFeeValue)) / 100;
        }
      }

      const fedAmount = (baseFee * fedRate) / 100;
      return {
        baseFee: Math.round(baseFee),
        fedAmount: Math.round(fedAmount),
        totalFee: Math.round(baseFee + fedAmount)
      };
    }

    function calculateEmi(principal, annualRate, tenureMonths, rateType) {
      if (tenureMonths <= 0 || principal <= 0) return { emi: 0, totalProfit: 0, totalPayable: 0 };
      if (rateType === "flat") {
        const totalProfit = principal * (annualRate / 100) * (tenureMonths / 12);
        const totalPayable = principal + totalProfit;
        return { emi: Math.round(totalPayable / tenureMonths), totalProfit: Math.round(totalProfit), totalPayable: Math.round(totalPayable) };
      } else {
        const r = (annualRate / 100) / 12;
        if (r === 0) return { emi: Math.round(principal / tenureMonths), totalProfit: 0, totalPayable: principal };
        const factor = Math.pow(1 + r, tenureMonths);
        const emi = Math.round((principal * r * factor) / (factor - 1));
        const totalPayable = emi * tenureMonths;
        return { emi, totalProfit: totalPayable - principal, totalPayable };
      }
    }

    function computePrincipalFromEmi(emi, annualRate, tenureMonths, rateType) {
      if (rateType === "flat") {
        const totalAllowable = emi * tenureMonths;
        const factor = 1 + ((annualRate / 100) * (tenureMonths / 12));
        return Math.round(totalAllowable / factor);
      } else {
        const r = (annualRate / 100) / 12;
        if (r === 0) return emi * tenureMonths;
        const factor = Math.pow(1 + r, tenureMonths);
        return Math.round((emi * (factor - 1)) / (r * factor));
      }
    }

    function calculateMaxLoanAmount(product, netIncome, dbrPercent, tenureMonths) {
      const maxEmiAllowed = (netIncome * dbrPercent) / 100;
      if (maxEmiAllowed <= 0 || tenureMonths <= 0) return 0;
      let rate = Number(product.defaultAnnualRate || 20);
      let principal = computePrincipalFromEmi(maxEmiAllowed, rate, tenureMonths, product.rateType);
      const appRate = getApplicableRate(product, principal);
      if (appRate !== rate) {
        rate = appRate;
        principal = computePrincipalFromEmi(maxEmiAllowed, rate, tenureMonths, product.rateType);
      }
      let rounded = Math.floor(principal / 1000) * 1000;
      while (rounded > 0) {
        const checkRate = getApplicableRate(product, rounded);
        const emi = calculateEmi(rounded, checkRate, tenureMonths, product.rateType).emi;
        if (emi <= maxEmiAllowed) break;
        rounded -= 1000;
      }
      return Math.max(0, rounded);
    }

    function getPrincipalForTenure(tenure) {
      const raw = (appState.calc.loanAmountInput || "").replace(/\D/g, "");
      const num = Number(raw);
      if (num > 0) return num;
      const p = getSelectedProduct();
      const inc = Number(appState.calc.monthlyIncomeInput) || 100000;
      const dbr = Number(appState.calc.allowedDbrInput) || 40;
      return calculateMaxLoanAmount(p, inc, dbr, tenure);
    }

    function generateInteractiveSchedule(principal, annualRate, tenureMonths, rateType, extraPayments = {}, mode = "reduce_emi") {
      const origEmiResult = calculateEmi(principal, annualRate, tenureMonths, rateType);
      let targetEmi = origEmiResult.emi;
      const list = [];
      let balance = principal;
      const monthlyRate = (annualRate / 100) / 12;
      const cal = new Date();
      let revisedTotalProfit = 0;
      let totalExtraPaid = 0;

      for (let m = 1; m <= tenureMonths; m++) {
        if (balance <= 0) break;
        const dueDate = new Date(cal.getFullYear(), cal.getMonth() + m, 1);
        const dateStr = dueDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
        const profitPart = Math.round(balance * monthlyRate);
        revisedTotalProfit += profitPart;

        const stdPrincipal = Math.max(0, targetEmi - profitPart);
        const actualPrincipal = Math.min(balance, stdPrincipal);
        const extra = Number(extraPayments[m]) || 0;
        totalExtraPaid += extra;

        const totalPrincipalPaid = Math.min(balance, actualPrincipal + extra);
        const emiThisMonth = totalPrincipalPaid + profitPart;
        const closing = Math.max(0, balance - totalPrincipalPaid);

        list.push({
          month: m,
          dueDate: dateStr,
          opening: Math.round(balance),
          principal: actualPrincipal,
          profit: profitPart,
          emi: emiThisMonth,
          extra: extra,
          closing: closing
        });
        balance = closing;

        if (mode === "reduce_emi" && extra > 0 && balance > 0 && m < tenureMonths) {
          const remainingMonths = tenureMonths - m;
          const recalculated = calculateEmi(balance, annualRate, remainingMonths, rateType);
          targetEmi = recalculated.emi;
        }
      }

      return {
        rows: list,
        summary: {
          mode: mode,
          originalProfit: origEmiResult.totalProfit,
          revisedProfit: revisedTotalProfit,
          profitSaved: Math.max(0, origEmiResult.totalProfit - revisedTotalProfit),
          originalTenure: tenureMonths,
          revisedTenure: list.length,
          monthsSaved: Math.max(0, tenureMonths - list.length),
          originalEmi: origEmiResult.emi,
          revisedEmi: mode === "reduce_emi" ? targetEmi : origEmiResult.emi,
          totalExtraPaid: totalExtraPaid
        }
      };
    }

    // --- 4. LEAD CREATION & AUTO-SYNC ---
    function autoSaveLead(triggerSource = "Auto") {
      const custName = appState.calc.customerName.trim() || `Client (${appState.calc.mobile || "Walk-in"})`;
      const p = getSelectedProduct();
      const tenure = appState.calc.selectedTenure;
      const principal = getPrincipalForTenure(tenure);
      const rate = getApplicableRate(p, principal);
      const emiRes = calculateEmi(principal, rate, tenure, p.rateType);
      const feeRes = calculateFee(p, principal);

      const newLead = {
        id: "kb-" + Date.now() + "-" + Math.random().toString(36).substring(2, 6),
        customerName: custName,
        mobile: appState.calc.mobile || "",
        dob: appState.calc.dob || "",
        followUpDate: "", // starts empty; assigned specifically on leads screen
        age: calculateAge(appState.calc.dob),
        monthlyIncome: Number(appState.calc.monthlyIncomeInput) || 0,
        dbrAllowed: Number(appState.calc.allowedDbrInput) || 0,
        productId: p.id,
        productName: p.name,
        loanAmount: principal,
        tenureMonths: tenure,
        monthlyEmi: emiRes.emi,
        totalProfit: emiRes.totalProfit,
        processingFee: feeRes.totalFee,
        status: "New",
        notes: appState.calc.specificNotes || `Lead captured via ${triggerSource}`,
        officerName: appState.profile.officerName || "Muhammad Usman",
        officerId: appState.profile.staffId || "RO-8942",
        branchName: appState.profile.branchName || "Main Branch",
        createdAt: Date.now(),
        syncStatus: appState.online ? "synced" : "pending_sync"
      };

      appState.leads.unshift(newLead);
      if (!appState.online) appState.syncQueue.push(newLead);
      saveState();
      showToast(`Lead saved to database (${triggerSource})`, "success");
      renderApp();
      return newLead;
    }

    function updateLeadStatus(id, newStatus) {
      const item = appState.leads.find(x => x.id === id);
      if (item) {
        item.status = newStatus;
        saveState();
        showToast(`Lead status updated to ${newStatus}`, "info");
        renderApp();
      }
    }

    // Modal to assign follow-up date to a specific customer
    function openAssignFollowUpModal(leadId) {
      const lead = appState.leads.find(x => x.id === leadId);
      if (lead) {
        appState.assignFollowUpLead = {
          id: lead.id,
          customerName: lead.customerName,
          followUpDate: lead.followUpDate || new Date().toISOString().slice(0, 10)
        };
        renderApp();
      }
    }

    function saveAssignedFollowUpDate() {
      if (!appState.assignFollowUpLead) return;
      const lead = appState.leads.find(x => x.id === appState.assignFollowUpLead.id);
      if (lead) {
        lead.followUpDate = appState.assignFollowUpLead.followUpDate;
        saveState();
        showToast(`Follow-up date assigned for ${lead.customerName}`, "success");
      }
      appState.assignFollowUpLead = null;
      renderApp();
    }

    function clearLeadFollowUpDate(id) {
      const lead = appState.leads.find(x => x.id === id);
      if (lead) {
        lead.followUpDate = "";
        saveState();
        showToast(`Follow-up date cleared for ${lead.customerName}`, "info");
      }
      appState.assignFollowUpLead = null;
      renderApp();
    }

    function openEditNoteModal(id) {
      const item = appState.leads.find(x => x.id === id);
      if (item) {
        appState.editingLeadNote = { id: item.id, notes: item.notes || "" };
        renderApp();
      }
    }

    function saveEditedNote() {
      if (!appState.editingLeadNote) return;
      const item = appState.leads.find(x => x.id === appState.editingLeadNote.id);

    function importProductsCsv(csvText) {
      if (!csvText || !csvText.trim()) return showToast("CSV text is empty", "warning");
      try {
        const lines = csvText.trim().split("\n").map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length <= 1) return showToast("CSV must contain a header and at least one row", "warning");
        const startIndex = (lines[0].toLowerCase().startsWith("id") || lines[0].toLowerCase().startsWith('"id')) ? 1 : 0;
        const newProducts = [];
        for (let i = startIndex; i < lines.length; i++) {
          const tokens = lines[i].split(",").map(t => t.replace(/"/g, "").trim());
          if (tokens.length >= 8) {
            newProducts.push({
              id: tokens[0] || "prod-" + Date.now() + "-" + i,
              name: tokens[1] || "Loan Facility " + i,
              rateType: (tokens[2] && tokens[2].toLowerCase().includes("flat")) ? "flat" : "reducing",
              defaultAnnualRate: Number(tokens[3]) || 20.0,
              minAmount: Number(tokens[4]) || 50000,
              maxAmount: Number(tokens[5]) || 5000000,
              minTenure: Number(tokens[6]) || 1,
              maxTenure: Number(tokens[7]) || 120,
              minAge: Number(tokens[8]) || 21,
              maxAgeAtMaturity: Number(tokens[9]) || 65,
              feeType: (tokens[10] && tokens[10].toLowerCase().includes("fixed")) ? "fixed" : "percentage",
              defaultFeeValue: Number(tokens[11]) || 1.5,
              fedRate: 16.0,
              rateSlabs: [],
              feeSlabs: []
            });
          }
        }
        if (newProducts.length === 0) return showToast("No valid products parsed from CSV", "error");
        appState.products = newProducts;
        appState.calc.productId = newProducts[0].id;
        saveState();
        showToast(`Imported ${newProducts.length} loan products!`, "success");
        appState.showBulkImportModal = false;
        renderApp();
      } catch (e) {
        showToast("CSV import error: " + e.message, "error");
      }
    }

    function render120TenureRows(product, customerAge, maxEligibleEmi) {
      const filter = appState.calc.matrixTenureFilter || "All";
      const tenures = [];
      for (let t = 1; t <= 120; t++) {
        if (filter === "1-12" && (t < 1 || t > 12)) continue;
        if (filter === "13-36" && (t < 13 || t > 36)) continue;
        if (filter === "37-60" && (t < 37 || t > 60)) continue;
        if (filter === "61-120" && (t < 61 || t > 120)) continue;
        tenures.push(t);
      }

      const isAutoMaxMode = !appState.calc.loanAmountInput || Number(appState.calc.loanAmountInput.replace(/\D/g, "")) <= 0;
      const effIncome = Number(appState.calc.monthlyIncomeInput) || 0;
      const effDbr = Number(appState.calc.allowedDbrInput) || 0;
      const effMaxEmi = Math.round((effIncome * effDbr) / 100);

      return tenures.map(t => {
        const principal = getPrincipalForTenure(t);
        const rate = getApplicableRate(product, principal);
        const emiRes = calculateEmi(principal, rate, t, product.rateType);
        const feeRes = calculateFee(product, principal);

        const isPlanEligible = isAutoMaxMode ? true : (emiRes.emi <= effMaxEmi);
        const dbrPercent = effIncome > 0 ? ((emiRes.emi / effIncome) * 100).toFixed(1) : "—";
        const isSelected = appState.calc.selectedTenure === t;

        return `
          <tr class="hover:bg-blue-50/50 cursor-pointer transition-colors ${isSelected ? 'bg-amber-50/80 font-semibold' : ''}"
            onclick="appState.calc.selectedTenure = ${t}; openAmortizationModal(${t});" title="Click to view Amortization Schedule">
            <td class="p-2 font-bold text-slate-800">${t} Mo <span class="text-[10px] text-slate-400 font-normal">(${(t/12).toFixed(1)}y)</span></td>
            <td class="p-2 font-bold text-slate-700">${formatCurrency(principal)}</td>
            <td class="p-2 font-extrabold text-blue-900">${formatCurrency(emiRes.emi)}</td>
            <td class="p-2 text-slate-600">${formatCurrency(emiRes.totalProfit)}</td>
            <td class="p-2 text-slate-500">${formatCurrency(feeRes.totalFee)}</td>
            <td class="p-2">
              ${isPlanEligible ? `
                <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800">
                  ELIGIBLE (${dbrPercent}%)
                </span>
              ` : `
                <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-rose-100 text-rose-800">
                  EXCEEDS DBR (${dbrPercent}%)
                </span>
              `}
            </td>
          </tr>
        `;
      }).join('');
    }

            <div class="space-y-3 text-xs">
              <div>
                <label class="block font-semibold text-slate-600 mb-1">Facility Name *</label>
                <input type="text" value="${p.name}" oninput="appState.editingProduct.name = this.value;" class="w-full px-3 py-1.5 bg-slate-50 border rounded-lg font-bold" />
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Rate Type</label>
                  <select onchange="appState.editingProduct.rateType = this.value; renderApp();" class="w-full px-3 py-1.5 bg-slate-50 border rounded-lg font-bold">
                    <option value="reducing" ${p.rateType === 'reducing' ? 'selected' : ''}>Reducing Balance</option>
                    <option value="flat" ${p.rateType === 'flat' ? 'selected' : ''}>Flat Rate %</option>
                  </select>
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Base Interest Rate %</label>
                  <input type="number" step="0.25" value="${p.defaultAnnualRate}" oninput="appState.editingProduct.defaultAnnualRate = Number(this.value);" class="w-full px-3 py-1.5 bg-slate-50 border rounded-lg font-bold" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Min Loan Principal (PKR)</label>
                  <input type="number" value="${p.minAmount}" oninput="appState.editingProduct.minAmount = Number(this.value);" class="w-full px-3 py-1.5 bg-slate-50 border rounded-lg" />
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Max Loan Principal (PKR)</label>
                  <input type="number" value="${p.maxAmount}" oninput="appState.editingProduct.maxAmount = Number(this.value);" class="w-full px-3 py-1.5 bg-slate-50 border rounded-lg" />
                </div>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Tenure Range (Months)</label>
                  <div class="flex space-x-1">
                    <input type="number" placeholder="Min" value="${p.minTenure}" oninput="appState.editingProduct.minTenure = Number(this.value);" class="w-1/2 px-2 py-1.5 bg-slate-50 border rounded-lg" />
                    <input type="number" placeholder="Max" value="${p.maxTenure}" oninput="appState.editingProduct.maxTenure = Number(this.value);" class="w-1/2 px-2 py-1.5 bg-slate-50 border rounded-lg" />
                  </div>
                </div>
                <div>
                  <label class="block font-semibold text-slate-600 mb-1">Customer Age Eligibility</label>
                  <div class="flex space-x-1">
                    <input type="number" placeholder="Min" value="${p.minAge}" oninput="appState.editingProduct.minAge = Number(this.value);" class="w-1/2 px-2 py-1.5 bg-slate-50 border rounded-lg" />
                    <input type="number" placeholder="Max Maturity" value="${p.maxAgeAtMaturity}" oninput="appState.editingProduct.maxAgeAtMaturity = Number(this.value);" class="w-1/2 px-2 py-1.5 bg-slate-50 border rounded-lg" />
                  </div>
                </div>
              </div>
            </div>

            <!-- SECTION A: Multi-Tier Interest Rate Slabs -->
            <div class="bg-blue-50/70 p-3 rounded-xl border border-blue-200 space-y-2 text-xs">
              <div class="flex justify-between items-center">
                <div>
                  <h4 class="font-extrabold text-blue-900 uppercase text-[11px]">Multi-Tier Interest Rate Slabs</h4>
                  <p class="text-[10px] text-blue-700">Amount-based rate tiers (e.g. 50k-100k = 39%, 100k-300k = 37%)</p>
                </div>
                <button type="button" onclick="addRateSlabToEditingProduct()" class="px-2.5 py-1 bg-blue-700 hover:bg-blue-800 text-white rounded-lg text-xs font-bold shadow-xs">
                  + Add Rate Slab
                </button>
              </div>

              ${(p.rateSlabs || []).length === 0 ? '<p class="text-[10px] text-slate-500 italic">No amount-based rate slabs added. Base rate applies.</p>' : ''}

              <div class="space-y-1.5">
                ${(p.rateSlabs || []).map((slab, i) => `
                  <div class="flex items-center space-x-1.5 bg-white p-2 rounded-lg border border-blue-200">
                    <div class="flex-1">
                      <span class="text-[9px] text-slate-400 block font-semibold">Min Amount (PKR)</span>
                      <input type="number" value="${slab.minAmount}" oninput="appState.editingProduct.rateSlabs[${i}].minAmount = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs font-bold" />
                    </div>
                    <div class="flex-1">
                      <span class="text-[9px] text-slate-400 block font-semibold">Max Amount (PKR)</span>
                      <input type="number" value="${slab.maxAmount}" oninput="appState.editingProduct.rateSlabs[${i}].maxAmount = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs font-bold" />
                    </div>
                    <div class="w-24">
                      <span class="text-[9px] text-slate-400 block font-semibold">Rate % APR</span>
                      <input type="number" step="0.25" value="${slab.annualRate}" oninput="appState.editingProduct.rateSlabs[${i}].annualRate = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs font-extrabold text-blue-900" />
                    </div>
                    <button type="button" onclick="removeRateSlabFromEditingProduct(${i})" class="text-rose-600 hover:text-rose-800 p-1 text-xs font-bold">🗑️</button>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- SECTION B: Multi-Tier Processing Fee Slabs -->
            <div class="bg-emerald-50/70 p-3 rounded-xl border border-emerald-200 space-y-2 text-xs">
              <div class="flex justify-between items-center">
                <div>
                  <h4 class="font-extrabold text-emerald-900 uppercase text-[11px]">Multi-Tier Processing Fee Slabs</h4>
                  <p class="text-[10px] text-emerald-700">% vs Min Fixed vs Max Fixed ("Whichever is higher" rule)</p>
                </div>
                <button type="button" onclick="addFeeSlabToEditingProduct()" class="px-2.5 py-1 bg-emerald-700 hover:bg-emerald-800 text-white rounded-lg text-xs font-bold shadow-xs">
                  + Add Fee Slab
                </button>
              </div>

              ${(p.feeSlabs || []).length === 0 ? '<p class="text-[10px] text-slate-500 italic">No amount-based fee slabs added. Base fee applies.</p>' : ''}

              <div class="space-y-1.5">
                ${(p.feeSlabs || []).map((slab, i) => `
                  <div class="bg-white p-2 rounded-lg border border-emerald-200 space-y-1">
                    <div class="flex items-center space-x-1.5">
                      <div class="flex-1">
                        <span class="text-[9px] text-slate-400 block font-semibold">Min Amount</span>
                        <input type="number" value="${slab.minAmount}" oninput="appState.editingProduct.feeSlabs[${i}].minAmount = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs" />
                      </div>
                      <div class="flex-1">
                        <span class="text-[9px] text-slate-400 block font-semibold">Max Amount</span>
                        <input type="number" value="${slab.maxAmount}" oninput="appState.editingProduct.feeSlabs[${i}].maxAmount = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs" />
                      </div>
                      <div class="w-28">
                        <span class="text-[9px] text-slate-400 block font-semibold">Calculation Type</span>
                        <select onchange="appState.editingProduct.feeSlabs[${i}].feeType = this.value; renderApp();" class="w-full px-1 py-1 bg-slate-50 border rounded text-xs font-bold">
                          <option value="whichever_higher" ${slab.feeType === 'whichever_higher' ? 'selected' : ''}>Higher Of (% vs Min)</option>
                          <option value="percentage" ${slab.feeType === 'percentage' ? 'selected' : ''}>Pure % (Min/Max)</option>
                          <option value="fixed" ${slab.feeType === 'fixed' ? 'selected' : ''}>Fixed Amount</option>
                        </select>
                      </div>
                      <button type="button" onclick="removeFeeSlabFromEditingProduct(${i})" class="text-rose-600 hover:text-rose-800 p-1 text-xs font-bold">🗑️</button>
                    </div>
                    <div class="flex items-center space-x-1.5 pt-1 border-t border-slate-100">
                      <div class="flex-1">
                        <span class="text-[9px] text-slate-400 block font-semibold">${slab.feeType === 'fixed' ? 'Fixed Fee (Rs)' : 'Fee % Value'}</span>
                        <input type="number" step="0.1" value="${slab.feeValue}" oninput="appState.editingProduct.feeSlabs[${i}].feeValue = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs font-bold" />
                      </div>
                      <div class="flex-1">
                        <span class="text-[9px] text-slate-400 block font-semibold">Min Fixed Floor (Rs)</span>
                        <input type="number" value="${slab.minFee || 0}" oninput="appState.editingProduct.feeSlabs[${i}].minFee = Number(this.value);" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs" />
                      </div>
                      <div class="flex-1">
                        <span class="text-[9px] text-slate-400 block font-semibold">Max Fixed Cap (Rs)</span>
                        <input type="number" value="${slab.maxFee || 0}" oninput="appState.editingProduct.feeSlabs[${i}].maxFee = Number(this.value);" placeholder="0 = No Cap" class="w-full px-2 py-1 bg-slate-50 border rounded text-xs" />
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div class="flex justify-end space-x-2 pt-2 border-t">
              <button onclick="appState.showProductEdit = false; renderApp();" class="px-3 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold">Cancel</button>
              <button onclick="saveProductModal()" class="px-4 py-1.5 bg-blue-700 hover:bg-blue-800 text-white rounded-lg text-xs font-bold shadow-xs">Save Facility</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveProductModal() {
      const p = appState.editingProduct;
      const idx = appState.products.findIndex(x => x.id === p.id);
      if (idx >= 0) appState.products[idx] = p;
      else appState.products.push(p);

      saveState();
      appState.showProductEdit = false;
      showToast("Facility & Slabs saved and synced to database", "success");
      renderApp();
    }

    function deleteProduct(id) {
      if (appState.products.length <= 1) return showToast("At least one facility must remain", "warning");
      if (confirm("Delete this facility?")) {
        appState.products = appState.products.filter(x => x.id !== id);
        saveState();
        renderApp();
      }
    }

    // --- 6. INITIALIZE ---
    window.addEventListener("online", () => {
      appState.online = true;
      showToast("Network connected • Online", "success");
      renderApp();
    });
    window.addEventListener("offline", () => {
      appState.online = false;
      showToast("Internet disconnected • Working Offline", "warning");
      renderApp();
    });

    document.addEventListener("DOMContentLoaded", () => {
      autoFetchGlobalProducts();
      renderApp();
    });
  </script>
</body>
</html>
