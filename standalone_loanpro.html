// Financial Calculator Functions
function calculateAge(dobString) {
  if (!dobString) return 0;
  const dob = new Date(dobString);
  const diffMs = Date.now() - dob.getTime();
  const ageDate = new Date(diffMs);
  return Math.abs(ageDate.getUTCFullYear() - 1970);
}

function calculateEmi(principal, annualRate, tenureMonths, rateType) {
  if (tenureMonths <= 0 || principal <= 0) return { emi: 0, totalProfit: 0, totalPayable: 0 };
  
  if (rateType === "flat") {
    const totalProfit = principal * (annualRate / 100) * (tenureMonths / 12);
    const totalPayable = principal + totalProfit;
    const emi = Math.round(totalPayable / tenureMonths);
    return { emi, totalProfit: Math.round(totalProfit), totalPayable: Math.round(totalPayable) };
  } else {
    // Reducing balance
    const monthlyRate = (annualRate / 100) / 12;
    if (monthlyRate === 0) {
      const emi = Math.round(principal / tenureMonths);
      return { emi, totalProfit: 0, totalPayable: principal };
    }
    const factor = Math.pow(1 + monthlyRate, tenureMonths);
    const emi = Math.round((principal * monthlyRate * factor) / (factor - 1));
    const totalPayable = emi * tenureMonths;
    const totalProfit = totalPayable - principal;
    return { emi, totalProfit, totalPayable };
  }
}

function calculateProcessingFee(principal, product) {
  let fee = 0;
  if (product.feeType === "fixed") {
    fee = Number(product.feeValue);
  } else {
    fee = (principal * Number(product.feeValue)) / 100;
  }
  const fed = (fee * Number(product.fedRate)) / 100;
  return {
    baseFee: Math.round(fee),
    fedAmount: Math.round(fed),
    totalFee: Math.round(fee + fed)
  };
}

function generateAmortizationSchedule(principal, annualRate, tenureMonths, rateType) {
  const schedule = [];
  let balance = principal;
  const monthlyRate = (annualRate / 100) / 12;
  const { emi } = calculateEmi(principal, annualRate, tenureMonths, rateType);

  const startDate = new Date();

  if (rateType === "flat") {
    const monthlyPrincipal = Math.round(principal / tenureMonths);
    const monthlyProfit = emi - monthlyPrincipal;
    for (let m = 1; m <= tenureMonths; m++) {
      const dueDate = new Date(startDate.getFullYear(), startDate.getMonth() + m, 1);
      const principalPaid = (m === tenureMonths) ? balance : monthlyPrincipal;
      const closing = Math.max(0, balance - principalPaid);
      schedule.push({
        month: m,
        date: dueDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
        opening: Math.round(balance),
        principal: principalPaid,
        profit: monthlyProfit,
        emi: principalPaid + monthlyProfit,
        closing: closing
      });
      balance = closing;
    }
  } else {
    for (let m = 1; m <= tenureMonths; m++) {
      const dueDate = new Date(startDate.getFullYear(), startDate.getMonth() + m, 1);
      const profitPart = Math.round(balance * monthlyRate);
      let principalPart = emi - profitPart;
      if (m === tenureMonths || principalPart > balance) {
        principalPart = balance;
      }
      const closing = Math.max(0, balance - principalPart);
      schedule.push({
        month: m,
        date: dueDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
        opening: Math.round(balance),
        principal: principalPart,
        profit: profitPart,
        emi: principalPart + profitPart,
        closing: closing
      });
      balance = closing;
      if (balance <= 0) break;
    }
  }
  return schedule;
}

function simulatePrepayment(principal, annualRate, tenureMonths, rateType, prepayAmount, atMonth, mode) {
  const origSchedule = generateAmortizationSchedule(principal, annualRate, tenureMonths, rateType);
  if (atMonth >= origSchedule.length) return null;

  const targetRow = origSchedule[atMonth - 1];
  const balanceBefore = targetRow.closing;
  const newBalance = Math.max(0, balanceBefore - prepayAmount);
  const remainingMonths = tenureMonths - atMonth;

  if (mode === "reduce_emi") {
    const revisedEmiCalc = calculateEmi(newBalance, annualRate, remainingMonths, rateType);
    let originalRemainingProfit = 0;
    for (let i = atMonth; i < origSchedule.length; i++) {
      originalRemainingProfit += origSchedule[i].profit;
    }
    const profitSaved = Math.max(0, originalRemainingProfit - revisedEmiCalc.totalProfit);
    return {
      newEmi: revisedEmiCalc.emi,
      monthsSaved: 0,
      profitSaved: Math.round(profitSaved),
      newTenure: tenureMonths
    };
  } else {
    // reduce tenure
    const currentEmi = origSchedule[0].emi;
    const monthlyRate = (annualRate / 100) / 12;
    let b = newBalance;
    let newMonths = 0;
    let newTotalProfit = 0;
    while (b > 0 && newMonths < remainingMonths) {
      newMonths++;
      const profit = Math.round(b * monthlyRate);
      newTotalProfit += profit;
      const principal = Math.min(b, currentEmi - profit);
      b -= principal;
    }
    let originalRemainingProfit = 0;
    for (let i = atMonth; i < origSchedule.length; i++) {
      originalRemainingProfit += origSchedule[i].profit;
    }
    const profitSaved = Math.max(0, originalRemainingProfit - newTotalProfit);
    return {
      newEmi: currentEmi,
      monthsSaved: remainingMonths - newMonths,
      profitSaved: Math.round(profitSaved),
      newTenure: atMonth + newMonths
    };
  }
}

function showToast(msg, type = "info") {
  appState.toastMessage = msg;
  appState.toastType = type;
  const toastEl = document.getElementById("toast-banner");
  if (toastEl) {
    toastEl.className = `fixed bottom-4 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-lg text-white font-medium shadow-lg z-50 transition-all ${
      type === "success" ? "bg-emerald-600" : type === "warning" ? "bg-amber-600" : type === "error" ? "bg-rose-600" : "bg-blue-600"
    }`;
    toastEl.innerText = msg;
    toastEl.style.display = "block";
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => {
      toastEl.style.display = "none";
    }, 3500);
  }
}

async function syncWithBackend() {
  if (appState.syncQueue.length === 0) {
    showToast("Everything is up to date!", "info");
    return;
  }
  showToast(`Pushing ${appState.syncQueue.length} queued leads to server...`, "info");
  
  // If webhook configured, send POST
  if (appState.settings.webhookUrl) {
    try {
      const res = await fetch(appState.settings.webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          officer: appState.settings.officerName,
          staffId: appState.settings.staffId,
          queue: appState.syncQueue
        })
      });
      if (res.ok) {
        appState.leads.forEach(l => l.syncStatus = "synced");
        appState.syncQueue = [];
        saveAllState();
        showToast("Leads synced successfully with cloud server!", "success");
        renderApp();
        return;
      }
    } catch (e) {
      console.warn("Backend sync failed, will retry later:", e);
    }
  }

  // Fallback simulation for offline demo/pabbly
  setTimeout(() => {
    appState.leads.forEach(l => l.syncStatus = "synced");
    appState.syncQueue = [];
    saveAllState();
    showToast("Leads synced successfully to storage queue!", "success");
    renderApp();
  }, 1000);
}

function exportLeadsToCsv() {
  if (!appState.leads.length) {
    showToast("No leads available to export", "warning");
    return;
  }
  const headers = [
    "Lead ID", "Date", "Customer Name", "Mobile", "Age", "Monthly Income",
    "Existing EMI", "Allowed DBR %", "Product Name", "Loan Amount",
    "Tenure (Mo)", "Monthly EMI", "Total Profit", "Processing Fee",
    "Status", "Officer ID", "Sync State", "Notes"
  ];

  const rows = appState.leads.map(l => [
    `"${l.id}"`,
    `"${new Date(l.createdAt).toLocaleDateString()}"`,
    `"${l.customerName.replace(/"/g, '""')}"`,
    `"${l.mobile}"`,
    l.age,
    l.monthlyIncome,
    l.existingEmi,
    l.dbrAllowed,
    `"${l.productName}"`,
    l.loanAmount,
    l.tenureMonths,
    l.monthlyEmi,
    l.totalProfit,
    l.processingFee,
    `"${l.status}"`,
    `"${l.officerId}"`,
    `"${l.syncStatus}"`,
    `"${(l.notes || '').replace(/"/g, '""')}"`
  ]);

  const csvContent = [headers.join(","), ...rows.map(r => r.join(","))].join("\r\n");
  
  if (window.AndroidBridge && window.AndroidBridge.exportCsv) {
    window.AndroidBridge.exportCsv("bank_leads_export.csv", csvContent);
  } else {
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `bank_leads_${new Date().toISOString().slice(0, 10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast("CSV file exported successfully!", "success");
  }
}

function renderTenureRows(product, rate, customerAge, maxEligibleEmi) {
  // Common standard banking tenures: 6, 12, 18, 24, 36, 48, 60, 72, 84, 96, 120
  const tenures = [6, 12, 18, 24, 36, 48, 60, 72, 84, 96, 120].filter(
    t => t >= product.minTenure && t <= product.maxTenure
  );

  return tenures.map(t => {
    const { emi, totalProfit, totalPayable } = calculateEmi(appState.calc.loanAmount, rate, t, product.rateType);
    const isEmiEligible = emi <= maxEligibleEmi;
    const ageAtMaturity = customerAge + Math.floor(t / 12);
    const isAgeEligible = ageAtMaturity <= product.maxAgeAtMaturity;
    const isSelected = appState.calc.selectedTenure === t;

    // DBR ratio calculation
    const totalObligation = Number(appState.calc.existingObligations) + emi;
    const income = Number(appState.calc.monthlyIncome) || 1;
    const dbrPercent = ((totalObligation / income) * 100).toFixed(1);

    return `
      <tr class="hover:bg-blue-50/50 cursor-pointer transition-colors ${isSelected ? 'bg-amber-50/80 font-medium' : ''}"
        onclick="appState.calc.selectedTenure = ${t}; openScheduleModal(${t});">
        <td class="p-2.5 font-bold text-slate-800">
          ${t} Mo <span class="text-[11px] text-slate-500 font-normal">(${(t/12).toFixed(1)} yr)</span>
        </td>
        <td class="p-2.5 font-bold text-blue-900">${formatCurrency(emi)}</td>
        <td class="p-2.5 text-slate-600">${formatCurrency(totalProfit)}</td>
        <td class="p-2.5 text-slate-600">${formatCurrency(totalPayable)}</td>
        <td class="p-2.5">
          ${!isAgeEligible ? `
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-900">
              Age ${ageAtMaturity} > Max ${product.maxAgeAtMaturity}
            </span>
          ` : isEmiEligible ? `
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">
              ELIGIBLE (${dbrPercent}% DBR)
            </span>
          ` : `
            <span class="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">
              EXCEEDS DBR (${dbrPercent}%)
            </span>
          `}
        </td>
        <td class="p-2.5 text-center">
          <button class="px-2 py-1 text-[11px] bg-blue-100 text-blue-800 hover:bg-blue-200 rounded font-semibold">
            Schedule ➔
          </button>
        </td>
      </tr>
    `;
  }).join('');
}

          </span>
        </div>
      </div>

      ${lead.notes ? `
        <p class="text-xs text-slate-600 bg-amber-50/50 p-2 rounded-lg border border-amber-100">
          📝 <i>${lead.notes}</i>
        </p>
      ` : ''}

      <!-- Lead Actions -->
      <div class="flex flex-wrap justify-between items-center pt-1 border-t border-slate-100 gap-2">
        <div class="flex items-center space-x-1.5">
          <label class="text-[11px] text-slate-500 font-medium">Status:</label>
          <select onchange="updateLeadStatus('${lead.id}', this.value)" class="text-xs bg-slate-100 border border-slate-300 rounded px-2 py-1 font-semibold outline-none">
            <option value="New" ${lead.status === 'New' ? 'selected' : ''}>New</option>
            <option value="Contacted" ${lead.status === 'Contacted' ? 'selected' : ''}>Contacted</option>
            <option value="Converted" ${lead.status === 'Converted' ? 'selected' : ''}>Converted</option>
            <option value="Lost" ${lead.status === 'Lost' ? 'selected' : ''}>Lost</option>
          </select>
        </div>

        <div class="flex space-x-1.5">
          <a href="tel:${lead.mobile}" class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-bold">
            📞 Call
          </a>
          <button onclick="shareLeadWhatsApp('${lead.id}')" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-bold">
            💬 WhatsApp
          </button>
          <button onclick="deleteLead('${lead.id}')" class="px-2 py-1 text-rose-600 hover:bg-rose-50 rounded text-xs font-bold">
            🗑️
          </button>
        </div>
      </div>
    </div>
  `;
}

function updateLeadStatus(id, newStatus) {
  const l = appState.leads.find(x => x.id === id);
  if (l) {
    l.status = newStatus;
    saveAllState();
    renderApp();
  }
}

function deleteLead(id) {
  if (confirm("Delete this lead permanently?")) {
    appState.leads = appState.leads.filter(l => l.id !== id);
    appState.syncQueue = appState.syncQueue.filter(l => l.id !== id);
    saveAllState();
    renderApp();
  }
}

function shareLeadWhatsApp(id) {
  const l = appState.leads.find(x => x.id === id);
  if (!l) return;
  const text = `Dear ${l.customerName}, following up regarding your ${l.productName} calculation: Amount: ${formatCurrency(l.loanAmount)}, Tenure: ${l.tenureMonths} Mo, Monthly EMI: ${formatCurrency(l.monthlyEmi)}. Let us know when to proceed with documentation. Best regards, ${appState.settings.officerName}`;
  const phone = l.mobile.replace(/[^0-9]/g, "");
  const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
}

function filterLeads(query) {
  const term = query.toLowerCase();
  const filtered = appState.leads.filter(l => 
    l.customerName.toLowerCase().includes(term) ||
    l.mobile.includes(term) ||
    l.productName.toLowerCase().includes(term)
  );
  const container = document.getElementById("leads-container");
  if (container) {
    container.innerHTML = filtered.map(lead => renderLeadCard(lead)).join('') || 
      `<div class="p-6 text-center text-slate-400 text-xs">No matching leads found.</div>`;
  }
}

function saveProductModal() {
  const p = appState.editingProduct;
  const idx = appState.products.findIndex(x => x.id === p.id);
  if (idx >= 0) {
    appState.products[idx] = p;
  } else {
    appState.products.push(p);
  }
  saveAllState();
  appState.productModalOpen = false;
  showToast("Product configuration saved", "success");
  renderApp();
}

function deleteProduct(id) {
  if (appState.products.length <= 1) {
    showToast("At least one product must remain", "warning");
    return;
  }
  if (confirm("Delete this product permanently?")) {
    appState.products = appState.products.filter(p => p.id !== id);
    if (appState.calc.productId === id) {
      appState.calc.productId = appState.products[0].id;
    }
    saveAllState();
    renderApp();
  }
}

function resetDefaultProducts() {
  if (confirm("Reset all products to bank standard defaults?")) {
    appState.products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
    saveAllState();
    showToast("Products reset to bank defaults", "success");
    renderApp();
  }
}
